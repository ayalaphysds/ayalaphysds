    <text x="14" y="18" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#7DD3FC">📊 Supply Chain &amp; Pricing</text>
  </g>

  <!-- ================= TECHNICAL GRAPHIC: VECTOR MATHEMATICAL CONVERGENCE ================= -->
  <g transform="translate(850, 155)">
    <!-- Mathematical Coordinate Rings / Pareto Frontier -->
    <ellipse cx="0" cy="0" rx="72" ry="32" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.7" transform="rotate(-20)"/>
    <ellipse cx="0" cy="0" rx="84" ry="24" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2,4" opacity="0.6" transform="rotate(35)"/>
    
    <!-- Geometric Starfleet Science Delta (Clean Precision Vector) -->
    <path d="M 0 -58 
             C 16 -12, 38 24, 44 50 
             C 28 42, 10 38, 0 42 
             C -10 38, -28 42, -44 50 
             C -38 24, -16 -12, 0 -58 Z" 
          fill="url(#delta-grad-dark)" stroke="#FBBF24" stroke-width="1.8"/>

    <!-- Inner Mathematical Optimization Vector Symbol (Convergence Point) -->
    <circle cx="0" cy="8" r="4" fill="#38BDF8"/>
    <circle cx="0" cy="8" r="10" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.8"/>
  </g>

  <!-- Telemetry Readouts (Right Column) -->
  <g transform="translate(735, 95)" opacity="0.85">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#38BDF8" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="0" y2="25" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="32" y="12" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#38BDF8">CONVERGENCE: EXACT</text>
    <text x="32" y="24" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#38BDF8">DUAL GAP: 0.00%</text>
