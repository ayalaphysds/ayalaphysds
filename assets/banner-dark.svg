<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Sebastián Ayala - Professional LCARS Data Science Banner">
  <defs>
    <linearGradient id="bg-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="delta-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.35"/>
    </linearGradient>

    <pattern id="grid-pat-dark" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#151F33" stroke-width="0.75" stroke-dasharray="2,4"/>
    </pattern>

    <filter id="soft-glow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="320" rx="14" fill="url(#bg-grad-dark)"/>
  <rect width="1000" height="320" rx="14" fill="url(#grid-pat-dark)" opacity="0.6"/>
  <rect x="1" y="1" width="998" height="318" rx="13" fill="none" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Subtle Mathematical Coordinate Axes in Background -->
  <g opacity="0.4">
