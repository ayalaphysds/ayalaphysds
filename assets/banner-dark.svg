    <line x1="720" y1="270" x2="950" y2="270" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="720" y1="50" x2="720" y2="270" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4,4"/>
  </g>

  <!-- ================= LCARS ARCHITECTURAL FRAMEWORK ================= -->

