<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Sebastián Ayala - Star Trek LCARS Banner">
  <defs>
    <linearGradient id="bg-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080F"/>
      <stop offset="100%" stop-color="#0D1322"/>
    </linearGradient>
    
    <linearGradient id="lcars-flow-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="40%" stop-color="#FF6600"/>
      <stop offset="70%" stop-color="#CC6699"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="delta-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCC00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF9900" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="glow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <pattern id="grid-pat-dark" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#152033" stroke-width="0.8" stroke-dasharray="2,4"/>
    </pattern>
  </defs>

  <!-- Outer Rounded Shell -->
  <rect width="1000" height="320" rx="16" fill="url(#bg-grad-dark)"/>
  <rect width="1000" height="320" rx="16" fill="url(#grid-pat-dark)" opacity="0.6"/>
  <rect x="1" y="1" width="998" height="318" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Starfleet Sensor Grid & Starfield Dots -->
  <g opacity="0.6">
    <circle cx="280" cy="65" r="1.2" fill="#FFFFFF"/>
    <circle cx="340" cy="140" r="1" fill="#FFFFFF"/>
    <circle cx="490" cy="50" r="1.5" fill="#FFFFFF"/>
    <circle cx="580" cy="190" r="1" fill="#FFFFFF"/>
    <circle cx="720" cy="85" r="1.8" fill="#FFFFFF"/>
    <circle cx="810" cy="160" r="1.2" fill="#FFFFFF"/>
    <circle cx="890" cy="95" r="1" fill="#FFFFFF"/>
    <circle cx="940" cy="220" r="1.4" fill="#FFFFFF"/>
    <circle cx="650" cy="110" r="1" fill="#FFFFFF"/>
    <circle cx="420" cy="240" r="1.2" fill="#FFFFFF"/>
  </g>

  <!-- ================= LCARS ARCHITECTURAL FRAMEWORK ================= -->
  
  <!-- Top Horizontal Header LCARS Bar -->
  <path d="M 170 20 L 760 20 A 10 10 0 0 1 770 30 L 770 42 A 6 6 0 0 1 764 48 L 170 48 Z" fill="#FF9900"/>
  
  <!-- Left Classic LCARS Elbow Bracket (Top-to-Side) -->
  <path d="M 30 75 
           A 35 35 0 0 1 65 40 
           L 155 40 
           L 155 48 
           L 75 48 
           A 25 25 0 0 0 50 73 
           L 50 245 
           A 25 25 0 0 0 75 270 
           L 155 270 
           L 155 278 
           L 65 278 
           A 35 35 0 0 1 30 243 
           Z" fill="#FF9900"/>

  <!-- Top Segmented LCARS Header Blocks -->
  <rect x="780" y="20" width="70" height="28" rx="4" fill="#FF6600"/>
  <rect x="858" y="20" width="60" height="28" rx="4" fill="#CC6699"/>
  <rect x="926" y="20" width="44" height="28" rx="4" fill="#38BDF8"/>

  <!-- LCARS Code Pill Cuts inside Top Bar -->
  <text x="180" y="38" font-family="monospace" font-size="12" font-weight="800" fill="#000000" letter-spacing="1.5">LCARS-4701</text>
  <text x="310" y="38" font-family="monospace" font-size="11" font-weight="700" fill="#000000" letter-spacing="1">FEDERATION SCIENCE &amp; ANALYTICS DIRECTORY</text>
  <text x="790" y="38" font-family="monospace" font-size="10.5" font-weight="700" fill="#000000">SEC-001</text>
  <text x="866" y="38" font-family="monospace" font-size="10.5" font-weight="700" fill="#000000">OR-DIV</text>
  <text x="933" y="38" font-family="monospace" font-size="10.5" font-weight="700" fill="#000000">DS-9</text>

  <!-- Left Spine Navigation Tactile Blocks -->
  <rect x="30" y="90" width="70" height="30" rx="6" fill="#38BDF8"/>
  <text x="40" y="110" font-family="monospace" font-size="11" font-weight="700" fill="#000000">01 // OR</text>

  <rect x="30" y="128" width="70" height="30" rx="6" fill="#CC6699"/>
  <text x="40" y="148" font-family="monospace" font-size="11" font-weight="700" fill="#000000">02 // PHYS</text>

  <rect x="30" y="166" width="70" height="30" rx="6" fill="#FF6600"/>
  <text x="40" y="186" font-family="monospace" font-size="11" font-weight="700" fill="#000000">03 // MILP</text>

  <rect x="30" y="204" width="70" height="30" rx="6" fill="#FFCC00"/>
  <text x="40" y="224" font-family="monospace" font-size="11" font-weight="700" fill="#000000">04 // ML</text>

  <!-- Bottom LCARS Horizontal Tray -->
  <path d="M 170 270 L 680 270 A 10 10 0 0 1 690 280 L 690 292 A 6 6 0 0 1 684 298 L 170 298 Z" fill="#38BDF8"/>
  <rect x="700" y="270" width="130" height="28" rx="4" fill="#CC6699"/>
  <rect x="838" y="270" width="132" height="28" rx="4" fill="#FF9900"/>

  <text x="180" y="288" font-family="monospace" font-size="11" font-weight="700" fill="#000000" letter-spacing="1">STARDATE: 78432.9 // OPTICAL DATA NETWORK: ONLINE</text>
  <text x="710" y="288" font-family="monospace" font-size="10.5" font-weight="700" fill="#000000">WARP FACTOR: 9.8</text>
  <text x="846" y="288" font-family="monospace" font-size="10.5" font-weight="700" fill="#000000">STATUS: COMBAT READY</text>

  <!-- ================= HERO CONTENT & TYPOGRAPHY ================= -->

  <!-- Top Metadata Breadcrumb -->
  <text x="125" y="86" font-family="monospace" font-size="11" font-weight="700" fill="#FF9900" letter-spacing="2">
    USS ENTERPRISE // ADVANCED QUANTITATIVE SYSTEMS
  </text>

  <!-- Candidate Name -->
  <text x="125" y="130" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" letter-spacing="2.5">
    SEBASTIÁN AYALA
  </text>

  <!-- Professional Sub-Title -->
  <text x="126" y="160" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#38BDF8" letter-spacing="1">
    PHYSICIST &amp; DATA SCIENTIST  ·  OPERATIONS RESEARCH &amp; APPLIED ML
  </text>

  <!-- Core Proposition / Mission statement -->
  <text x="126" y="188" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">
    Transforming complex physical systems &amp; operational entropy into deterministic, optimal business decisions.
  </text>

  <!-- Pill Specialization Badges -->
  <!-- Pill 1: MILP -->
  <g transform="translate(126, 210)">
    <rect width="180" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2"/>
    <text x="14" y="18" font-family="monospace" font-size="11" font-weight="700" fill="#7DD3FC">📐 MILP &amp; SciPy HiGHS</text>
  </g>

  <!-- Pill 2: Complex Systems -->
  <g transform="translate(316, 210)">
    <rect width="215" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2"/>
    <text x="14" y="18" font-family="monospace" font-size="11" font-weight="700" fill="#7DD3FC">⚛️ Complex Systems &amp; Monte Carlo</text>
  </g>

  <!-- Pill 3: Supply Chain -->
  <g transform="translate(541, 210)">
    <rect width="195" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2"/>
    <text x="14" y="18" font-family="monospace" font-size="11" font-weight="700" fill="#7DD3FC">📊 Supply Chain &amp; Pricing Models</text>
  </g>

  <!-- ================= STARFLEET ARTWORK (RIGHT WING) ================= -->
  <!-- Starfleet Command Delta Insignia Vector -->
  <g transform="translate(850, 150) scale(0.95)" filter="url(#glow-dark)">
    <!-- Orbital trajectory rings -->
    <ellipse cx="0" cy="0" rx="75" ry="32" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="4,3" transform="rotate(-25)"/>
    <ellipse cx="0" cy="0" rx="90" ry="22" fill="none" stroke="#FF9900" stroke-width="1" stroke-dasharray="2,4" transform="rotate(35)"/>
    
    <!-- Outer Starfleet Delta Frame -->
    <path d="M 0 -65 
             C 18 -15, 42 25, 48 55 
             C 32 45, 10 40, 0 46 
             C -10 40, -32 45, -48 55 
             C -42 25, -18 -15, 0 -65 Z" 
          fill="url(#delta-grad-dark)" stroke="#FFCC00" stroke-width="2"/>
    
    <!-- Inner Science Division Emblem (Two interlocking ellipses / atom symbol) -->
    <ellipse cx="0" cy="0" rx="14" ry="7" fill="none" stroke="#000000" stroke-width="2.5" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="14" ry="7" fill="none" stroke="#000000" stroke-width="2.5" transform="rotate(30)"/>
    <circle cx="0" cy="0" r="3" fill="#000000"/>
  </g>

  <!-- Decorative Telemetry Lines and Crosshairs -->
  <line x1="745" y1="95" x2="775" y2="95" stroke="#38BDF8" stroke-width="1.5" opacity="0.6"/>
  <line x1="760" y1="80" x2="760" y2="110" stroke="#38BDF8" stroke-width="1.5" opacity="0.6"/>
  <text x="740" y="125" font-family="monospace" font-size="9" font-weight="700" fill="#38BDF8" opacity="0.75">GRID: SECTOR 001</text>
  <text x="740" y="137" font-family="monospace" font-size="9" font-weight="700" fill="#38BDF8" opacity="0.75">SCAN: OPTIMAL</text>

</svg>